server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Tăng giới hạn tải file qua proxy Nginx lên 50MB để tránh lỗi 413 Payload Too Large
    client_max_body_size 50M;

    # Serve Vue SPA - mọi route đều trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests sang PHP container
    location /api/ {
        proxy_pass http://api:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Uploads requests sang PHP container
    location ^~ /uploads/ {
        proxy_pass http://api:80/uploads/;
        proxy_set_header Host $host;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
